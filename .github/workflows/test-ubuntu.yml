# =============================================================================
#  SWE30009 Project - Extension Task 1
#  Runs the Selenium functional test suite for the LLM AI Gateway on Linux.
#
#  Trigger : manual only (workflow_dispatch), as required by the brief.
#  Runner  : ubuntu-latest
#  Timeout : 30 minutes, so a hung browser session cannot occupy a runner
#            indefinitely if a test stalls waiting for an element.
# =============================================================================

name: Selenium Tests (Ubuntu)

on:
  workflow_dispatch:

jobs:
  selenium-ubuntu:
    name: Functional tests on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # -- 1. Bring the repository onto the runner -----------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # -- 2. Python -----------------------------------------------------------
      #    The version is pinned rather than left as "3.x" so that a new Python
      #    release cannot change the behaviour of a run without a code change.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # -- 3. Dependencies -----------------------------------------------------
      #    Installed from requirements.txt, where selenium is version-pinned.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list

      # -- 4. Browser and WebDriver -------------------------------------------
      #    Google Chrome is preinstalled on GitHub-hosted Ubuntu runners, and
      #    Selenium Manager (built into Selenium 4.6+) downloads the matching
      #    chromedriver automatically on first use. No third-party action is
      #    needed, which keeps the pipeline free of extra supply-chain risk.
      #    check_browser.py starts a real headless session so that a browser
      #    problem fails here with a clear message instead of appearing later
      #    as ten identical WebDriver errors inside the test report.
      - name: Verify Chrome and chromedriver
        run: python tests/check_browser.py

      # -- 5. Web server -------------------------------------------------------
      #    The application is static, so Python's built-in server is enough.
      #    It is backgrounded with nohup so it survives into the next step,
      #    then polled until it answers rather than relying on a fixed sleep.
      - name: Start the local web server
        run: |
          nohup python -m http.server 8000 --directory app > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:8000/index.html > /dev/null 2>&1; then
              echo "Server responded after ${i}s."
              break
            fi
            sleep 1
          done
          # Final check: fail the step if the server never came up.
          curl -sSf http://localhost:8000/index.html > /dev/null

      # -- 6. The test suite ---------------------------------------------------
      #    continue-on-error lets the report still be built and uploaded when
      #    tests fail. The job is failed deliberately in the last step instead,
      #    so a red run always comes with the evidence attached.
      - name: Run Selenium test suite
        id: tests
        continue-on-error: true
        run: |
          python tests/test_gateway.py \
            --url http://localhost:8000/index.html \
            --csv tests/test_cases.csv \
            --headless

      # -- 7. Report (Extension Task 3) ---------------------------------------
      - name: Generate HTML test report
        if: always()
        run: python tests/generate_report.py --platform "ubuntu-latest"

      - name: Publish summary to the run page
        if: always()
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-ubuntu
          path: |
            test-report.html
            test_results.csv
            screenshots/
            server.log
          if-no-files-found: warn
          retention-days: 30

      # -- 8. Final status -----------------------------------------------------
      - name: Fail the job if any test failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "One or more test cases failed. See the test-report-ubuntu artifact."
          exit 1
